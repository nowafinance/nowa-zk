name: Prover CI

on:
  push:
    paths:
      - "prover/**"
      - ".github/workflows/prover.yml"
  pull_request:
    paths:
      - "prover/**"
      - ".github/workflows/prover.yml"

concurrency:
  group: prover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: prover

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.10"
          cache-dependency-path: prover/go.sum

      - name: Install deps (optional but makes builds deterministic)
        run: |
          make deps

      - name: Test
        run: |
          # run tests with race detector and verbose output
          go test -v -race ./...
