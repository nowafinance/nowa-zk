name: Prover CI

on:
  workflow_dispatch:
  push:
    paths:
      - "prover/**"
      - ".github/workflows/prover.yml"
  pull_request:
    paths:
      - "prover/**"
      - ".github/workflows/prover.yml"

concurrency:
  group: prover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.10"
          cache-dependency-path: prover/go.sum

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install deps (optional but makes builds deterministic)
        run: |
          make deps

      - name: Generate Keys (Setup)
        run: |
          make setup

      - name: Test
        run: |
          # run tests with race detector and verbose output
          cd prover && go test -v -race -timeout 30m ./...

      - name: Upload Keys and Verifier
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: zk-keys-and-verifier
          path: |
            .nowa-zk/keys/
            contracts/src/generated/RollupVerifier.sol
          if-no-files-found: error
          retention-days: 7
