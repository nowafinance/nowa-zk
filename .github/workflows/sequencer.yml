name: Sequencer CI

on:
  push:
    paths:
      - "sequencer/**"
      - ".github/workflows/sequencer.yml"
  pull_request:
    paths:
      - "sequencer/**"
      - ".github/workflows/sequencer.yml"

concurrency:
  group: sequencer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sequencer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.10"
          cache-dependency-path: sequencer/go.sum

      - name: Test
        run: go test -v -race ./...