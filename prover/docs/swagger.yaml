basePath: /
definitions:
  internal_api.BatchResponse:
    properties:
      batchHash:
        type: string
      batchNumber:
        type: integer
      newStateRoot:
        type: string
      oldStateRoot:
        type: string
      status:
        type: integer
      submitter:
        type: string
      timestamp:
        type: integer
      txHash:
        type: string
      txHashes:
        description: L2 transaction hashes
        items:
          type: string
        type: array
      verifiedAt:
        type: integer
    type: object
  internal_api.StatusResponse:
    properties:
      batch_number:
        type: integer
      note:
        type: string
      status:
        type: string
      timestamp:
        type: integer
    type: object
info:
  contact: {}
  description: API for the Tan-ZK Rollup Prover
  title: Tan-ZK Prover API
  version: "1.0"
paths:
  /:
    get:
      description: Redirects to Swagger UI
      responses:
        "302":
          description: Found
      summary: List available endpoints
      tags:
      - Meta
  /batches/{id}:
    get:
      description: Get details of a specific batch
      parameters:
      - description: Batch ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.BatchResponse'
        "400":
          description: Invalid batch ID
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get batch by ID
      tags:
      - Batches
  /batches/latest:
    get:
      description: Get details of the latest verified batch from the contract
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.BatchResponse'
        "404":
          description: No batches found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get latest verified batch
      tags:
      - Batches
  /status/{id}:
    get:
      description: Get proof generation status for a batch
      parameters:
      - description: Batch ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.StatusResponse'
        "400":
          description: Invalid batch ID
          schema:
            type: string
      summary: Get proof status
      tags:
      - Proofs
swagger: "2.0"
